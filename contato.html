<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Noah Scherner</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap">
    <link rel="stylesheet" href="styles.css">
        <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html">Noah Scherner</a>
    </div>
    <nav>
        <ul>
            <li class="lang-toggle-header">
                <button class="active" data-lang="pt-br">PT</button>
                <span class="lang-separator">/</span>
                <button data-lang="en">EN</button>
            </li>
            <li><a href="obras.html"><span lang="pt-br">Obras selecionadas</span><span lang="en">Selected works</span></a></li>
            <li><a href="cv.html"><span lang="pt-br">Sobre</span><span lang="en">About</span></a></li>
            <li><a href="contato.html" class="active"><span lang="pt-br">Contato</span><span lang="en">Contact</span></a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="contact-container">
        <div class="contact-info-section">
            <p><a href="mailto:noah.scherner6@gmail.com">noah.scherner6@gmail.com</a></p>

            <p><a href="https://instagram.com/noah_scherner" target="_blank" rel="noopener">Instagram</a></p>

            <h4><span lang="pt-br">Representado por</span><span lang="en">Represented by</span></h4>
            <p>
                Cana Galeria<br>
                Rio de Janeiro, BR
            </p>
        </div>

        <div class="contact-image">
            <img src="assets/obras/agape.jpg" alt="Noah Scherner">
        </div>
    </div>
</main>

<script>
// Global language toggle functionality with localStorage persistence
(function() {
    const savedLang = localStorage.getItem('preferredLang') || 'pt-br';
    document.body.dataset.lang = savedLang;

    // Update active button state on load
    document.querySelectorAll('.lang-toggle-header button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === savedLang);
    });

    // Add click handlers
    document.querySelectorAll('.lang-toggle-header button').forEach(button => {
        button.addEventListener('click', function() {
            const lang = this.dataset.lang;

            // Update active button
            document.querySelectorAll('.lang-toggle-header button').forEach(btn => {
                btn.classList.remove('active');
            });
            this.classList.add('active');

            // Update body data attribute to toggle language display
            document.body.dataset.lang = lang;

            // Persist language preference
            localStorage.setItem('preferredLang', lang);
        });
    });
})();
</script>

</body>
</html>
